name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a PR cancels its stale run; pushes to main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: typecheck / lint / format / unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  fallow:
    name: fallow (dead code / dupes / health)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write # sticky findings comment
      checks: write # Fallow Check Run
    steps:
      - uses: actions/checkout@v4
      - uses: fallow-rs/fallow@v2
        with:
          format: sarif
          # Advisory job (see continue-on-error above): surface findings as PR
          # annotations but don't hard-fail the check on them. Default is true.
          fail-on-issues: false
          # Post a sticky PR comment + Fallow Check Run so findings are prominent,
          # not just inline annotations (GitHub caps those at 10 per type per step).
          comment: true
