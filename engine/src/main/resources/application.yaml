server:
  port: ${ENGINE_PORT:8080}
spring:
  servlet:
    multipart:
      # Transaction files from the data import page; the July file is 36 MB.
      max-file-size: 200MB
      max-request-size: 200MB
  datasource:
    url: ${ENGINE_DB_URL:jdbc:postgresql://127.0.0.1:5440/postgres}
    username: ${ENGINE_DB_USER:postgres}
    password: ${ENGINE_DB_PASSWORD:postgres}
  liquibase:
    change-log: classpath:/db/changelog-master.xml
bedrock:
  model-id: ${BEDROCK_MODEL_ID:eu.anthropic.claude-sonnet-4-5-20250929-v1:0}
rules:
  explanation-model-id: ${RULES_EXPLANATION_MODEL_ID:eu.anthropic.claude-opus-4-5-20251101-v1:0}
